<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Vision Bot 🤖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0066ff;
            --secondary: #ff6600;
            --bg: #0a0e27;
            --surface: #1a1f3a;
            --text: #e0e6ff;
            --text-secondary: #8892b0;
            --border: #2d3561;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1a0033 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 102, 255, 0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }

        .header {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: var(--border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .input-area {
            border-top: 1px solid var(--border);
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        input[type="text"],
        input[type="file"] {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 14px;
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        input[type="file"] {
            padding: 8px 10px;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 14px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .file-label {
            padding: 10px 16px;
            background: rgba(0, 102, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 8px;
            cursor: pointer;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
        }

        .file-label:hover {
            background: rgba(0, 102, 255, 0.2);
        }

        input[type="file"] {
            display: none;
        }

        .image-preview {
            max-width: 150px;
            max-height: 150px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .error {
            padding: 12px 14px;
            background: rgba(255, 102, 0, 0.1);
            border: 1px solid var(--secondary);
            border-radius: 8px;
            color: #ffb366;
            font-size: 13px;
        }

        .info {
            padding: 12px 14px;
            background: rgba(0, 102, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: #99ccff;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }

            .message-content {
                max-width: 90%;
            }

            .input-group {
                min-width: 100%;
            }

            button {
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Chat Vision</h1>
            <p>Chat + Analisis Gambar dengan AI (100% Gratis)</p>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message bot">
                <div class="message-content">
                    👋 Halo! Saya AI Assistant kamu. Kamu bisa:
                    <br>💬 Chat dengan saya
                    <br>🖼️ Kirim gambar untuk dianalisis
                    <br><br>Mulai dengan mengetik pertanyaan atau kirim gambar! 😊
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <div class="input-group">
                    <input type="text" id="messageInput" placeholder="Ketik pertanyaan atau caption..." autocomplete="off">
                    <label for="imageInput" class="file-label">📷 Gambar</label>
                    <input type="file" id="imageInput" accept="image/*">
                    <button onclick="sendMessage()">Kirim</button>
                </div>
            </div>
            <div id="imagePreviewContainer"></div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const imageInput = document.getElementById('imageInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');

        let isLoading = false;
        let selectedImage = null;

        // Auto scroll ke bawah
        function scrollToBottom() {
            setTimeout(() => {
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 100);
        }

        // Add message ke chat
        function addMessage(text, type = 'bot', isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            if (isError) {
                content.className += ' error';
            }
            
            content.textContent = text;
            messageDiv.appendChild(content);
            chatArea.appendChild(messageDiv);
            
            scrollToBottom();
        }

        // Show loading
        function showLoading() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'loadingMessage';
            
            const content = document.createElement('div');
            content.className = 'loading';
            content.innerHTML = '<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>';
            
            messageDiv.appendChild(content);
            chatArea.appendChild(messageDiv);
            
            scrollToBottom();
        }

        // Remove loading
        function removeLoading() {
            const loadingMsg = document.getElementById('loadingMessage');
            if (loadingMsg) loadingMsg.remove();
        }

        // Send message
        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message && !selectedImage) {
                alert('Ketik pesan atau pilih gambar!');
                return;
            }
            
            if (isLoading) return;
            
            isLoading = true;
            showLoading();
            
            try {
                if (selectedImage) {
                    // Send image
                    await sendImage(message);
                } else {
                    // Send text
                    addMessage(message, 'user');
                    
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({message})
                    });
                    
                    const data = await response.json();
                    removeLoading();
                    
                    if (data.success) {
                        addMessage(data.response, 'bot');
                    } else {
                        addMessage(`❌ ${data.error}`, 'bot', true);
                    }
                }
                
                messageInput.value = '';
                
            } catch (error) {
                removeLoading();
                addMessage(`❌ Error: ${error.message}`, 'bot', true);
            } finally {
                isLoading = false;
            }
        }

        // Send image
        async function sendImage(caption = '') {
            const formData = new FormData();
            formData.append('image', selectedImage);
            formData.append('question', caption || 'Apa yang ada di gambar ini?');
            
            try {
                const response = await fetch('/api/analyze-image', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                removeLoading();
                
                addMessage(caption || selectedImage.name, 'user');
                
                if (data.success) {
                    addMessage(data.response, 'bot');
                } else {
                    addMessage(`❌ ${data.error}`, 'bot', true);
                }
                
                // Clear image
                selectedImage = null;
                imagePreviewContainer.innerHTML = '';
                
            } catch (error) {
                removeLoading();
                addMessage(`❌ Error: ${error.message}`, 'bot', true);
            }
        }

        // Image selection
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedImage = file;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreviewContainer.innerHTML = `
                        <img src="${event.target.result}" alt="Preview" class="image-preview">
                        <button style="margin-top: 8px; width: 100%;" onclick="clearImage()">✕ Hapus Gambar</button>
                    `;
                };
                reader.readAsDataURL(file);
            }
        });

        function clearImage() {
            selectedImage = null;
            imageInput.value = '';
            imagePreviewContainer.innerHTML = '';
        }

        // Enter to send
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Focus input
        messageInput.focus();
    </script>
</body>
</html>
